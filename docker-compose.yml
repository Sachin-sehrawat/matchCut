services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchcut}
      POSTGRES_USER: ${POSTGRES_USER:-matchcut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchcut}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-matchcut}']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-matchcut}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-matchcut}
    volumes:
      - mongo_data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-matchcut}:${POSTGRES_PASSWORD:-matchcut}@db:5432/${POSTGRES_DB:-matchcut}
      MONGODB_URI: mongodb://${MONGO_USER:-matchcut}:${MONGO_PASSWORD:-matchcut}@mongo:27017/matchcut?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      PORT: 4000
      # Founder-only fallback — see "Founder tooling" in CLAUDE.md.
      DB_DRIVER: ${DB_DRIVER:-postgres}
      SQLITE_PATH: /app/data/matchcut.sqlite
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
    volumes:
      - backend_data:/app/data
    ports:
      - '127.0.0.1:4000:4000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  db_data:
  mongo_data:
  backend_data:
